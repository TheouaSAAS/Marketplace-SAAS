name: Qualité

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Aucun service externe en CI : le site doit fonctionner sans eux.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
