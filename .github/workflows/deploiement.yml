name: Déploiement

# Lancement manuel (onglet Actions). Ordre d'une mise en production (docs/runbook.md) :
#   1. « migrations » : contrôles qualité, puis migrations de la base visée ;
#   2. l'hébergeur déploie le code (intégration Git) ;
#   3. « verification » : sonde de disponibilité et test de fumée sur le site déployé.
# Les secrets et variables sont ceux de l'environnement GitHub choisi
# (Settings > Environments : « preproduction », « production » avec approbation).
on:
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement visé
        type: choice
        options: [preproduction, production]
        required: true
      etape:
        description: Étape
        type: choice
        options: [migrations, verification]
        default: migrations

concurrency:
  group: deploiement-${{ inputs.environnement }}
  cancel-in-progress: false

jobs:
  qualite:
    if: inputs.etape == 'migrations'
    uses: ./.github/workflows/ci.yml

  migrations:
    if: inputs.etape == 'migrations'
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environnement }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prérequis de l'environnement
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Variable NEXT_PUBLIC_SUPABASE_URL ou secret SUPABASE_ACCESS_TOKEN absent de l'environnement ${{ inputs.environnement }}."
            exit 1
          fi
      - name: État avant migration
        run: npm run db:status
      - name: Migrations en attente
        run: npm run db:migrate
      - name: Vérifications SQL (transactions annulées, préproduction seulement)
        if: inputs.environnement == 'preproduction'
        run: npm run db:verify

  verification:
    if: inputs.etape == 'verification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environnement }}
    env:
      SMOKE_BASE_URL: ${{ vars.SITE_URL }}
      SMOKE_STATUS_TOKEN: ${{ secrets.INTERNAL_STATUS_TOKEN }}
      SMOKE_ACCESS_CODE: ${{ secrets.SITE_ACCESS_CODE }}
      # Publiques : indiquent au test de fumée que le site déployé a une base.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Site et base disponibles
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then echo "::error::Variable SITE_URL absente de l'environnement."; exit 1; fi
          curl --fail --silent --show-error --max-time 30 "$SMOKE_BASE_URL/api/health/ready"
      - name: Test de fumée sur le site déployé
        run: npm run smoke
